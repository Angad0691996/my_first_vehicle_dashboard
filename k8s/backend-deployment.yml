apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-subscriber
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-subscriber
  template:
    metadata:
      labels:
        app: backend-subscriber
    spec:
      containers:
      - name: backend
        image: angad696/backend-subscriber:latest
        ports:
        - containerPort: 5000
        env:
          - name: DB_HOST
            valueFrom:
              configMapKeyRef:
                name: app-config
                key: DB_HOST
          - name: DB_USER
            valueFrom:
              configMapKeyRef:
                name: app-config
                key: DB_USER
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: mysql-secret
                key: DB_PASSWORD
          - name: DB_NAME
            valueFrom:
              configMapKeyRef:
                name: app-config
                key: DB_NAME
