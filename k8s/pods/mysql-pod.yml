apiVersion: v1
kind: Pod
metadata:
  name: mysql-db
  labels:
    app: mysql-db
spec:
  containers:
    - name: mysql-db
      image: mysql:8.0
      ports:
        - containerPort: 3306
      envFrom:
        - configMapRef:
            name: vehicle-config
        - secretRef:
            name: vehicle-secrets
      volumeMounts:
        - name: mysql-init
          mountPath: /docker-entrypoint-initdb.d
  volumes:
    - name: mysql-init
      hostPath:
        path: /mnt/data/mysql-init
        type: Directory
