apiVersion: v1
kind: Pod
metadata:
  name: react-dashboard
  labels:
    app: react-dashboard
spec:
  containers:
    - name: react-dashboard
      image: angad696/react-dashboard:latest
      ports:
        - containerPort: 80
      envFrom:
        - configMapRef:
            name: vehicle-config
---
apiVersion: v1
kind: Service
metadata:
  name: react-dashboard
spec:
  type: NodePort
  selector:
    app: react-dashboard
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
